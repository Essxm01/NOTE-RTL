<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نوّتي — مساحة الكتابة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f7f7f8;
    --paper:#ffffff;
    --fg:#121214;
    --muted:#8b8f97;
    --border:#ececee;
    --soft:#f2f2f4;
    --code:#f5f5f7;
    --radius:20px;
    --danger:#e5484d;
  }
  [data-theme="dark"]{
    --bg:#08080a;
    --paper:#101012;
    --fg:#f0f0f2;
    --muted:#85888f;
    --border:#1e1f22;
    --soft:#18181b;
    --code:#17171a;
    --danger:#ff6369;
  }

  *{ box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{
    margin:0;
    font-family:'Cairo', system-ui, -apple-system, sans-serif;
    background:var(--bg);
    color:var(--fg);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    transition:background .25s ease, color .25s ease;
    -webkit-font-smoothing:antialiased;
  }

  ::-webkit-scrollbar{ width:11px; height:11px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:99px;
    border:3px solid var(--bg);
  }

  /* ========== شاشة تسجيل الدخول ========== */
  #auth-screen{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    padding:20px;
    overflow-y:auto;
  }
  #auth-screen.hidden{ display:none; }

  .auth-card{
    width:100%;
    max-width:420px;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:40px 34px;
    box-shadow:0 20px 60px -30px rgba(0,0,0,.15);
    margin:auto;
  }
  [data-theme="dark"] .auth-card{
    box-shadow:0 20px 60px -30px rgba(0,0,0,.7);
  }

  .auth-logo{
    width:52px; height:52px;
    display:grid; place-items:center;
    background:var(--fg); color:var(--paper);
    border-radius:15px;
    font-weight:800; font-size:24px;
    margin:0 auto 22px;
  }

  .auth-title{
    font-size:22px;
    font-weight:800;
    text-align:center;
    margin:0 0 6px;
  }
  .auth-sub{
    font-size:13.5px;
    color:var(--muted);
    text-align:center;
    margin:0 0 28px;
    font-weight:500;
  }

  .tabs{
    display:flex;
    gap:4px;
    padding:4px;
    background:var(--soft);
    border-radius:12px;
    margin-bottom:22px;
  }
  .tabs button{
    flex:1;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    padding:9px;
    border:none;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:color .2s, background .2s;
  }
  .tabs button.active{
    background:var(--paper);
    color:var(--fg);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }

  .field{
    margin-bottom:15px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    font-family:inherit;
    font-size:15px;
    padding:12px 15px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--bg);
    color:var(--fg);
    outline:none;
    transition:border-color .2s;
    direction:ltr;
    text-align:left;
  }
  .field input:focus{ border-color:var(--fg); }

  .auth-submit{
    width:100%;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    padding:13px;
    border:none;
    border-radius:12px;
    background:var(--fg);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .2s, transform .12s;
    margin-top:6px;
  }
  .auth-submit:hover{ opacity:.9; }
  .auth-submit:active{ transform:scale(.98); }
  .auth-submit:disabled{ opacity:.5; cursor:not-allowed; }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:22px 0;
    color:var(--muted);
    font-size:12.5px;
    font-weight:600;
  }
  .divider::before,.divider::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }

  .btn-google{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:700;
    padding:12px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--paper);
    color:var(--fg);
    cursor:pointer;
    transition:background .2s, border-color .2s;
  }
  .btn-google:hover{ background:var(--soft); }
  .btn-google:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-google svg{ width:19px; height:19px; flex:0 0 19px; }

  .auth-msg{
    font-size:13px;
    font-weight:600;
    text-align:center;
    padding:11px 14px;
    border-radius:11px;
    margin-bottom:16px;
    display:none;
  }
  .auth-msg.error{
    display:block;
    background:color-mix(in srgb, var(--danger) 12%, transparent);
    color:var(--danger);
  }
  .auth-msg.success{
    display:block;
    background:color-mix(in srgb, #30a46c 12%, transparent);
    color:#30a46c;
  }

  /* ========== الهيدر ========== */
  header{
    position:sticky;
    top:0;
    z-index:30;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:14px;
    padding:13px 32px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    transition:background .25s, border-color .25s;
  }

  .brand{ display:flex; align-items:center; gap:11px; min-width:0; }
  .logo{
    width:38px; height:38px; flex:0 0 38px;
    display:grid; place-items:center;
    background:var(--fg); color:var(--paper);
    border-radius:12px;
    font-weight:800; font-size:18px;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.35; min-width:0; }
  .brand-text .title{ font-weight:800; font-size:16.5px; }
  .brand-text .sub{ font-size:11.5px; color:var(--muted); font-weight:500; white-space:nowrap; }

  .segmented{
    display:flex;
    gap:3px;
    padding:3px;
    background:var(--soft);
    border-radius:99px;
    border:1px solid var(--border);
  }
  .segmented button{
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:7px 22px;
    border:none;
    border-radius:99px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:color .2s, background .2s;
    white-space:nowrap;
  }
  .segmented button:hover{ color:var(--fg); }
  .segmented button.active{
    background:var(--paper);
    color:var(--fg);
    box-shadow:0 1px 3px rgba(0,0,0,.07);
  }

  .actions{ display:flex; align-items:center; gap:7px; justify-content:flex-end; }

  .btn{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:9px 15px;
    border-radius:11px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--fg);
    cursor:pointer;
    transition:background .18s, color .18s, border-color .18s, transform .12s;
    white-space:nowrap;
  }
  .btn:hover{ background:var(--fg); color:var(--paper); border-color:var(--fg); }
  .btn:active{ transform:scale(.96); }
  .btn.icon{
    width:38px; height:38px;
    padding:0;
    display:grid; place-items:center;
    border-radius:11px;
  }
  .btn.icon svg{ width:16.5px; height:16.5px; }

  [data-theme="light"] .icon-sun{ display:none; }
  [data-theme="dark"] .icon-moon{ display:none; }

  /* ========== معلومات المستخدم ========== */
  .user-chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 12px 5px 5px;
    border:1px solid var(--border);
    border-radius:99px;
    cursor:default;
    max-width:220px;
  }
  .user-avatar{
    width:28px; height:28px;
    border-radius:50%;
    background:var(--soft);
    display:grid; place-items:center;
    font-weight:800;
    font-size:12px;
    color:var(--fg);
    overflow:hidden;
    flex:0 0 28px;
  }
  .user-avatar img{ width:100%; height:100%; object-fit:cover; }
  .user-name{
    font-size:12.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ========== الورقة ========== */
  main{
    flex:1;
    width:100%;
    display:flex;
    justify-content:center;
    padding:30px 3% 20px;
  }
  .paper{
    width:100%;
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:60px clamp(28px, 6vw, 110px) 90px;
    min-height:calc(100vh - 180px);
    box-shadow:0 1px 2px rgba(0,0,0,.02), 0 12px 40px -18px rgba(0,0,0,.07);
    transition:background .25s, border-color .25s;
  }
  [data-theme="dark"] .paper{
    box-shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 40px -18px rgba(0,0,0,.6);
  }

  #editor{
    display:block;
    width:100%;
    min-height:calc(100vh - 320px);
    border:none;
    outline:none;
    resize:none;
    overflow:hidden;
    background:transparent;
    color:var(--fg);
    font-family:'Cairo', sans-serif;
    font-size:18px;
    line-height:2.15;
    padding:0;
    direction:rtl;
    text-align:right;
    caret-color:var(--fg);
  }
  #editor::placeholder{ color:var(--muted); opacity:.85; }

  #preview{
    display:none;
    font-size:18px;
    line-height:2.15;
    word-wrap:break-word;
    overflow-wrap:break-word;
  }
  #preview > *:first-child{ margin-top:0; }
  #preview h1,#preview h2,#preview h3,
  #preview h4,#preview h5,#preview h6{
    font-weight:800;
    line-height:1.55;
    margin:1.5em 0 .65em;
  }
  #preview h1{ font-size:1.9em; }
  #preview h2{ font-size:1.52em; }
  #preview h3{ font-size:1.28em; }
  #preview h4{ font-size:1.12em; }
  #preview h5,#preview h6{ font-size:1em; color:var(--muted); }
  #preview h1,#preview h2{ padding-bottom:.35em; border-bottom:1px solid var(--border); }
  #preview p{ margin:0 0 1.15em; }
  #preview strong{ font-weight:800; }
  #preview em{ font-style:italic; }
  #preview del{ opacity:.5; }
  #preview a{ color:inherit; text-decoration:underline; text-underline-offset:4px; }
  #preview ul,#preview ol{ margin:0 0 1.15em; padding-inline-start:1.6em; }
  #preview li{ margin-bottom:.5em; }
  #preview li::marker{ color:var(--muted); font-weight:700; }
  #preview blockquote{
    margin:0 0 1.15em;
    padding:.5em 1.2em;
    border-inline-start:3px solid var(--fg);
    color:var(--muted);
    background:var(--code);
    border-radius:0 14px 14px 0;
  }
  #preview blockquote p:last-child{ margin-bottom:0; }
  #preview hr{ border:none; border-top:1px solid var(--border); margin:2em 0; }
  #preview code{
    font-family:ui-monospace,monospace;
    font-size:.85em;
    background:var(--code);
    padding:2px 7px;
    border-radius:7px;
    direction:ltr;
    unicode-bidi:embed;
  }
  #preview pre{
    direction:ltr;
    text-align:left;
    background:var(--code);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    overflow-x:auto;
    margin:0 0 1.25em;
    line-height:1.85;
  }
  #preview pre code{ background:none; padding:0; font-size:13.5px; }
  #preview table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 1.35em;
    font-size:.93em;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }
  #preview th,#preview td{
    border:1px solid var(--border);
    padding:10px 14px;
    text-align:right;
  }
  #preview th{ background:var(--code); font-weight:700; }
  #preview img{ max-width:100%; border-radius:14px; display:block; }

  .empty{
    color:var(--muted);
    font-size:15px;
    line-height:2;
    border:1px dashed var(--border);
    border-radius:16px;
    padding:26px;
    text-align:center;
  }

  footer{
    text-align:center;
    padding:0 22px 26px;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .toast{
    position:fixed;
    bottom:26px;
    right:50%;
    transform:translate(50%,26px);
    background:var(--fg);
    color:var(--paper);
    padding:11px 24px;
    border-radius:99px;
    font-size:13.5px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:300;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.3);
  }
  .toast.show{ opacity:1; transform:translate(50%,0); }

  /* ========== شاشة التحميل ========== */
  #loading-screen{
    position:fixed;
    inset:0;
    z-index:400;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
  }
  #loading-screen.hidden{ display:none; }
  .spinner{
    width:40px; height:40px;
    border:3px solid var(--border);
    border-top-color:var(--fg);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to { transform:rotate(360deg); } }
  .loading-text{
    font-size:13.5px;
    font-weight:700;
    color:var(--muted);
  }

  @media (max-width:860px){
    header{
      grid-template-columns:1fr auto;
      grid-template-areas:"brand actions" "seg seg";
      row-gap:10px;
      padding:12px 16px;
    }
    .brand{ grid-area:brand; }
    .actions{ grid-area:actions; }
    .segmented{ grid-area:seg; justify-self:center; }
    .brand-text .sub{ display:none; }
    main{ padding:18px 12px 14px; }
    .paper{ padding:32px 22px 48px; border-radius:16px; }
    #editor{ font-size:17px; }
    #preview{ font-size:17px; }
    .user-name{ display:none; }
  }
</style>
</head>

<body>

<!-- ========== شاشة التحميل ========== -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">جارٍ التحميل…</div>
</div>

<!-- ========== شاشة تسجيل الدخول ========== -->
<div id="auth-screen" class="hidden">
  <div class="auth-card">
    <div class="auth-logo">ن</div>
    <h1 class="auth-title">مرحبًا بك في نوّتي</h1>
    <p class="auth-sub">سجّل دخولك للوصول إلى نوتاتك الخاصة</p>

    <div class="auth-msg" id="authMsg"></div>

    <div class="tabs">
      <button type="button" data-auth-tab="login" class="active">تسجيل الدخول</button>
      <button type="button" data-auth-tab="signup">إنشاء حساب</button>
    </div>

    <form id="authForm" autocomplete="on">
      <div class="field">
        <label for="authEmail">البريد الإلكتروني</label>
        <input type="email" id="authEmail" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="authPassword">كلمة المرور</label>
        <input type="password" id="authPassword" required minlength="6" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="auth-submit" id="authSubmitBtn">تسجيل الدخول</button>
    </form>

    <div class="divider">أو</div>

    <button type="button" class="btn-google" id="btnGoogle">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      المتابعة بحساب Google
    </button>
  </div>
</div>

<!-- ========== التطبيق الرئيسي ========== -->
<header id="app-header" style="display:none">
  <div class="brand">
    <div class="logo">ن</div>
    <div class="brand-text">
      <span class="title">نوّتي</span>
      <span class="sub">مساحة أنيقة للكتابة والتنسيق</span>
    </div>
  </div>

  <div class="segmented" id="segmented">
    <button type="button" data-mode="write" class="active">كتابة</button>
    <button type="button" data-mode="read">قراءة</button>
  </div>

  <div class="actions">
    <div class="user-chip" id="userChip" title="">
      <div class="user-avatar" id="userAvatar"></div>
      <span class="user-name" id="userName"></span>
    </div>

    <button class="btn icon" id="btnCopy" type="button" title="نسخ النص">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="12" height="12" rx="2.5"/>
        <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>

    <button class="btn icon" id="btnDownload" type="button" title="تنزيل كملف Markdown">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 19h16"/>
      </svg>
    </button>

    <button class="btn icon" id="btnClear" type="button" title="مسح الكل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16"/><path d="M9 6V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6"/>
        <path d="M6.5 6l.8 13.2A1.8 1.8 0 0 0 9.1 21h5.8a1.8 1.8 0 0 0 1.8-1.8L17.5 6"/>
        <path d="M10 10.5v6M14 10.5v6"/>
      </svg>
    </button>

    <button class="btn icon" id="btnTheme" type="button" title="تبديل المظهر">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>

    <button class="btn icon" id="btnLogout" type="button" title="تسجيل الخروج">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <path d="m10 17 5-5-5-5"/>
        <path d="M15 12H3"/>
      </svg>
    </button>
  </div>
</header>

<main id="app-main" style="display:none">
  <article class="paper">
    <textarea id="editor" dir="rtl" spellcheck="false"
      placeholder="اكتب هنا… أو الصق نصًا من الذكاء الاصطناعي (نص عادي أو Markdown)، ثم اضغط «قراءة» لتراه منسّقًا."></textarea>
    <div id="preview"></div>
  </article>
</main>

<footer id="app-footer" style="display:none">
  <span id="counter">0 كلمة · 0 حرف</span>
</footer>

<div class="toast" id="toast"></div>

<!-- ========== Firebase SDK + منطق التطبيق ========== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    onAuthStateChanged,
    signOut,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import {
    getFirestore,
    doc,
    getDoc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  /* =========================================================
     ✅ إعدادات مشروعك — NOTE-RTL-ARABIC
     ========================================================= */
  const firebaseConfig = {
    apiKey: "AIzaSyD1F14gKAU3Fg58Ulfv6PxK5-10bZi-SPE",
    authDomain: "note-rtl-arabic.firebaseapp.com",
    projectId: "note-rtl-arabic",
    storageBucket: "note-rtl-arabic.firebasestorage.app",
    messagingSenderId: "893520407167",
    appId: "1:893520407167:web:e3680452406682fd586d4a",
    measurementId: "G-BHN5YZSFJX"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  /* =========================================================
     محرّك Markdown
     ========================================================= */
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function applyInline(s){
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
    s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/___(.+?)___/g,'<strong><em>$1</em></strong>');
    s = s.replace(/__(.+?)__/g,'<strong>$1</strong>');
    s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
    s = s.replace(/~~(.+?)~~/g,'<del>$1</del>');
    return s;
  }
  function renderMarkdown(src){
    let text = escapeHtml(String(src).replace(/\r\n?/g,'\n'));
    const blocks = [];
    text = text.replace(/```[ \t]*([\w+#.-]*)[ \t]*\n?([\s\S]*?)```/g,(m,l,c)=>{
      const i=blocks.length;
      blocks.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');
      return '\u0000B'+i+'\u0000';
    });
    const codes=[];
    text = text.replace(/`([^`\n]+)`/g,(m,c)=>{
      const i=codes.length;codes.push('<code>'+c+'</code>');
      return '\u0000C'+i+'\u0000';
    });
    const lines=text.split('\n'),out=[];
    let para=[],listType=null,i=0;
    function flushPara(){ if(para.length){out.push('<p>'+para.map(applyInline).join('<br>')+'</p>');para=[];} }
    function closeList(){ if(listType){out.push('</'+listType+'>');listType=null;} }
    function parseRow(l){return l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());}
    while(i<lines.length){
      const raw=lines[i],line=raw.trim();
      if(!line){flushPara();closeList();i++;continue;}
      if(/^\u0000B\d+\u0000$/.test(line)){flushPara();closeList();out.push(line);i++;continue;}
      let m=line.match(/^(#{1,6})\s+(.*)$/);
      if(m){flushPara();closeList();const lvl=m[1].length;out.push('<h'+lvl+'>'+applyInline(m[2].trim())+'</h'+lvl+'>');i++;continue;}
      if(/^(-{3,}|\*{3,}|_{3,})$/.test(line)){flushPara();closeList();out.push('<hr>');i++;continue;}
      if(line.indexOf('|')!==-1&&lines[i+1]&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        flushPara();closeList();
        const head=parseRow(lines[i]);i+=2;const body=[];
        while(i<lines.length&&lines[i].trim()&&lines[i].indexOf('|')!==-1){body.push(parseRow(lines[i]));i++;}
        let t='<table><thead><tr>'+head.map(c=>'<th>'+applyInline(c)+'</th>').join('')+'</tr></thead><tbody>';
        body.forEach(r=>{t+='<tr>'+r.map(c=>'<td>'+applyInline(c)+'</td>').join('')+'</tr>';});
        t+='</tbody></table>';out.push(t);continue;
      }
      if(/^>\s?/.test(line)){
        flushPara();closeList();const buf=[];
        while(i<lines.length&&/^\s*>\s?/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
        out.push('<blockquote>'+buf.map(applyInline).join('<br>')+'</blockquote>');continue;
      }
      m=raw.match(/^\s*[-*+]\s+(.*)$/);
      if(m){flushPara();if(listType!=='ul'){closeList();out.push('<ul>');listType='ul';}out.push('<li>'+applyInline(m[1])+'</li>');i++;continue;}
      m=raw.match(/^\s*\d+[.)]\s+(.*)$/);
      if(m){flushPara();if(listType!=='ol'){closeList();out.push('<ol>');listType='ol';}out.push('<li>'+applyInline(m[1])+'</li>');i++;continue;}
      closeList();para.push(line);i++;
    }
    flushPara();closeList();
    let html=out.join('\n');
    html=html.replace(/\u0000B(\d+)\u0000/g,(m,n)=>blocks[+n]);
    html=html.replace(/\u0000C(\d+)\u0000/g,(m,n)=>codes[+n]);
    return html;
  }

  /* =========================================================
     عناصر الواجهة
     ========================================================= */
  const loadingScreen = document.getElementById('loading-screen');
  const authScreen    = document.getElementById('auth-screen');
  const appHeader     = document.getElementById('app-header');
  const appMain       = document.getElementById('app-main');
  const appFooter     = document.getElementById('app-footer');

  const authForm   = document.getElementById('authForm');
  const authEmail  = document.getElementById('authEmail');
  const authPass   = document.getElementById('authPassword');
  const authSubmit = document.getElementById('authSubmitBtn');
  const authMsg    = document.getElementById('authMsg');
  const btnGoogle  = document.getElementById('btnGoogle');

  const editor  = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const counter = document.getElementById('counter');
  const toastEl = document.getElementById('toast');
  const seg     = document.getElementById('segmented');

  let mode = 'write';
  let currentUser = null;
  let saveTimer = null;
  let isLoadingNote = false;

  const EMPTY_HTML = '<p class="empty">لا يوجد شيء بعد… ابدأ بالكتابة أو الصق نصًا من الذكاء الاصطناعي، ثم اضغط «قراءة» لتراه منسّقًا.</p>';

  /* =========================================================
     أدوات مساعدة
     ========================================================= */
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove('show'),1800);
  }

  function showAuthMsg(text, type){
    authMsg.textContent = text;
    authMsg.className = 'auth-msg ' + (type || '');
  }
  function clearAuthMsg(){ authMsg.className = 'auth-msg'; authMsg.textContent=''; }

  function autosize(){
    if(mode !== 'write') return;
    editor.style.height='auto';
    editor.style.height = editor.scrollHeight + 'px';
  }

  function updatePreview(){
    const val = editor.value;
    preview.innerHTML = val.trim() ? renderMarkdown(val) : EMPTY_HTML;
  }

  function updateCounter(){
    const val = editor.value;
    const words = val.trim() ? val.trim().split(/\s+/).length : 0;
    counter.textContent = words.toLocaleString('ar-EG')+' كلمة · '+val.length.toLocaleString('ar-EG')+' حرف';
  }

  function updateUI(){
    autosize();
    updatePreview();
    updateCounter();
  }

  /* =========================================================
     Firestore: حفظ واسترجاع النوتات لكل مستخدم
     ========================================================= */
  async function saveNoteToFirestore(uid, content){
    if(!uid) return;
    try{
      const ref = doc(db, 'users', uid, 'notes', 'main');
      await setDoc(ref, {
        content: content,
        updatedAt: new Date().toISOString()
      }, { merge:true });
    }catch(e){
      console.error('خطأ في الحفظ:', e);
      toast('تعذّر حفظ النوت');
    }
  }

  async function loadNoteFromFirestore(uid){
    try{
      const ref = doc(db, 'users', uid, 'notes', 'main');
      const snap = await getDoc(ref);
      if(snap.exists()) return snap.data().content || '';
      return '';
    }catch(e){
      console.error('خطأ في التحميل:', e);
      return '';
    }
  }

  /* =========================================================
     المظهر
     ========================================================= */
  document.getElementById('btnTheme').addEventListener('click', ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('nawti:theme', next); }catch(e){}
  });

  /* =========================================================
     التبديل بين الكتابة والقراءة
     ========================================================= */
  seg.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-mode]');
    if(!btn || btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    Array.prototype.forEach.call(seg.children, b=> b.classList.toggle('active', b.dataset.mode === mode));
    if(mode === 'read'){
      updatePreview();
      editor.style.display = 'none';
      preview.style.display = 'block';
      window.scrollTo({top:0,behavior:'smooth'});
    }else{
      preview.style.display = 'none';
      editor.style.display = 'block';
      autosize();
      editor.focus();
    }
  });

  /* =========================================================
     أحداث المحرر
     ========================================================= */
  editor.addEventListener('input', ()=>{
    updateUI();
    if(isLoadingNote || !currentUser) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=> saveNoteToFirestore(currentUser.uid, editor.value), 800);
  });

  editor.addEventListener('keydown',(e)=>{
    if(e.key === 'Tab'){
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0,s)+'    '+editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s+4;
      updateUI();
    }
  });

  window.addEventListener('resize', autosize);

  /* =========================================================
     أدوات: نسخ / تنزيل / مسح
     ========================================================= */
  function copyText(text){
    const done = ()=> toast('تم النسخ ✓');
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
    function fallback(){
      const ta=document.createElement('textarea');
      ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done();}catch(e){toast('تعذّر النسخ');}
      ta.remove();
    }
  }

  document.getElementById('btnCopy').addEventListener('click', ()=>{
    if(!editor.value.trim()){toast('لا يوجد نص لنسخه');return;}
    copyText(editor.value);
  });

  document.getElementById('btnDownload').addEventListener('click', ()=>{
    if(!editor.value.trim()){toast('لا يوجد نص لتنزيله');return;}
    const blob=new Blob([editor.value],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.href=url;a.download='note-'+stamp+'.md';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);toast('تم التنزيل ✓');
  });

  document.getElementById('btnClear').addEventListener('click', ()=>{
    if(!editor.value.trim()) return;
    if(confirm('هل تريد مسح كل المحتوى؟')){
      editor.value='';
      updateUI();
      if(currentUser) saveNoteToFirestore(currentUser.uid, '');
      toast('تم المسح');
    }
  });

  /* =========================================================
     المصادقة
     ========================================================= */
  document.querySelectorAll('[data-auth-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('[data-auth-tab]').forEach(b=> b.classList.toggle('active', b === btn));
      const isLogin = btn.dataset.authTab === 'login';
      authSubmit.textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
      authPass.autocomplete = isLogin ? 'current-password' : 'new-password';
      clearAuthMsg();
    });
  });

  authForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    clearAuthMsg();
    const email = authEmail.value.trim();
    const pass  = authPass.value;
    const isLogin = document.querySelector('[data-auth-tab].active').dataset.authTab === 'login';

    authSubmit.disabled = true;
    authSubmit.textContent = 'جارٍ المعالجة…';

    try{
      if(isLogin){
        await signInWithEmailAndPassword(auth, email, pass);
      }else{
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: email.split('@')[0] });
      }
      authForm.reset();
    }catch(err){
      const map = {
        'auth/email-already-in-use':'هذا البريد الإلكتروني مستخدم بالفعل.',
        'auth/invalid-email':'البريد الإلكتروني غير صالح.',
        'auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل).',
        'auth/user-not-found':'لا يوجد حساب بهذا البريد.',
        'auth/wrong-password':'كلمة المرور غير صحيحة.',
        'auth/invalid-credential':'بيانات الدخول غير صحيحة.',
        'auth/too-many-requests':'محاولات كثيرة، حاول لاحقًا.',
        'auth/network-request-failed':'تعذّر الاتصال بالشبكة.',
        'auth/operation-not-allowed':'هذه الطريقة غير مفعّلة في Firebase.'
      };
      showAuthMsg(map[err.code] || 'حدث خطأ: '+err.message, 'error');
    }finally{
      authSubmit.disabled = false;
      const isLoginNow = document.querySelector('[data-auth-tab].active').dataset.authTab === 'login';
      authSubmit.textContent = isLoginNow ? 'تسجيل الدخول' : 'إنشاء حساب';
    }
  });

  btnGoogle.addEventListener('click', async ()=>{
    clearAuthMsg();
    btnGoogle.disabled = true;
    try{
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      await signInWithPopup(auth, provider);
    }catch(err){
      console.error(err);
      if(err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request'){
        showAuthMsg('تعذّر الدخول بحساب Google: ' + (err.code || err.message), 'error');
      }
    }finally{
      btnGoogle.disabled = false;
    }
  });

  document.getElementById('btnLogout').addEventListener('click', async ()=>{
    if(confirm('هل تريد تسجيل الخروج؟')){
      await signOut(auth);
    }
  });

  /* =========================================================
     مراقبة حالة المصادقة
     ========================================================= */
  onAuthStateChanged(auth, async (user)=>{
    loadingScreen.classList.add('hidden');

    if(user){
      currentUser = user;

      // إظهار التطبيق وإخفاء شاشة الدخول
      authScreen.classList.add('hidden');
      appHeader.style.display = '';
      appMain.style.display = '';
      appFooter.style.display = '';

      // تحديث معلومات المستخدم
      const nameEl = document.getElementById('userName');
      const avEl   = document.getElementById('userAvatar');
      const chip   = document.getElementById('userChip');
      const displayName = user.displayName || (user.email ? user.email.split('@')[0] : 'مستخدم');
      nameEl.textContent = displayName;
      chip.title = user.email || displayName;
      if(user.photoURL){
        avEl.innerHTML = '<img src="'+user.photoURL+'" alt="">';
      }else{
        avEl.textContent = displayName.charAt(0).toUpperCase();
      }

      // تحميل النوت الخاصة بهذا المستخدم
      isLoadingNote = true;
      editor.value = '';
      updateUI();
      const note = await loadNoteFromFirestore(user.uid);
      editor.value = note;
      isLoadingNote = false;
      updateUI();

    }else{
      currentUser = null;

      // إخفاء التطبيق وإظهار شاشة الدخول
      appHeader.style.display = 'none';
      appMain.style.display = 'none';
      appFooter.style.display = 'none';
      authScreen.classList.remove('hidden');

      editor.value = '';
      preview.innerHTML = EMPTY_HTML;
      counter.textContent = '0 كلمة · 0 حرف';
      authForm.reset();
      clearAuthMsg();
    }
  });

  /* =========================================================
     التهيئة
     ========================================================= */
  (function init(){
    try{
      const savedTheme = localStorage.getItem('nawti:theme');
      if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
      else if(window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  })();

</script>
</body>
</html>
